<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Defect Detection System</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            margin-top: 20px;
            overflow-y: auto;
        }

        h1 {
            text-align: center;
            color: #4a9eff;
            text-shadow: 0 0 10px rgba(74, 158, 255, 0.6);
            position: fixed;
            top: 0;
            width: 100%;
        }

        .camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 35px;
        }

        .camera-box {
            background: #222;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 10px #000;
        }

        .camera-box:hover {
            border-color: #4a9eff;
        }

        .camera-header {
            background: #333;
            padding: 10px;
            font-weight: bold;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        .camera-feed img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .camera-info {
            background: #1a1a1a;
            padding: 10px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        .sidebar {
            width: 220px;
            background: #1a1a1a;
            border-left: 2px solid #333;
            padding: 10px;
            margin-top: 73px;
            border-radius: 1.5rem;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 1rem;
            text-align: center;
            margin-bottom: 10px;
            color: #4a9eff;
        }

        .sidebar .preview {
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 5px;
            overflow: hidden;
            background: #222;
            position: relative;
        }

        .sidebar .preview img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            display: block;
        }

        .sidebar .preview span {
            display: block;
            text-align: center;
            padding: 5px;
            font-size: 0.8rem;
            background: #333;
        }

        .marker {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background-color: grey; /* default idle */
    }

    .marker.active {
        background-color: red !important; /* solid red when active */
        box-shadow: none !important; /* no glow */
        border: none !important;
    }

    .preview {
        position: relative; /* needed for marker positioning */
        margin-bottom: 15px;
        border: 1px solid #333;
        border-radius: 5px;
        overflow: hidden;
        background: #222;
    }
    </style>
</head>
<body>
    <h1>Defect Detection System</h1>
    <div class="main-content">
        <div class="camera-grid">
            {% for cam in streams %}
            <div class="camera-box">
                <div class="camera-header">
                    <span>Camera {{ loop.index }}</span>
                    <span class="camera-status">ACTIVE</span>
                </div>
                <div class="camera-feed">
                    <img src="{{ url_for('proxy_stream', cam_id=loop.index0) }}" alt="Camera {{ loop.index }} Feed">
                </div>
                <div class="camera-info">
                    <span class="timestamp" id="timestamp-{{ loop.index }}"></span>
                    <span>1920x1080</span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    <div class="sidebar">
        <h2>Camera Preview</h2>
        {% for cam in streams %}
        <div class="preview">
            <span class="marker" id="marker-{{ loop.index0 }}"></span>
            <img src="{{ url_for('proxy_stream', cam_id=loop.index0) }}" alt="Camera {{ loop.index }} Preview">
            <span>Camera {{ loop.index }}</span>
        </div>
        {% endfor %}
    </div>

    <script>
        function updateTimestamps() {
            const now = new Date();
            const time = now.toLocaleTimeString();
            document.querySelectorAll('.timestamp').forEach(ts => {
                ts.textContent = time;
            });
        }

        function updateMarkers() {
            fetch('/status')
                .then(res => res.json())
                .then(data => {
                    data.forEach((state, idx) => {
                        const marker = document.getElementById(`marker-${idx}`);
                        if (state) {
                            marker.classList.add('active');
                        } else {
                            marker.classList.remove('active');
                        }
                    });
                });
        }

        setInterval(updateTimestamps, 1000);
        setInterval(updateMarkers, 1000);
        updateTimestamps();
        updateMarkers();
    </script>
</body>
</html>
