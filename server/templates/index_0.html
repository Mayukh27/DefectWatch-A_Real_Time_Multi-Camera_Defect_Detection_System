<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Defect Detection System</title>
    <style>
        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #4a9eff;
            font-size: 2.5em;
            margin-bottom: 40px;
            text-shadow: 0 0 8px rgba(74, 158, 255, 0.6);
        }

        .camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 25px;
        }

        .camera-box {
            background: #1a1a1a;
            border: 1.5px solid #333;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
            transition: border-color 0.3s;
            /* Add fixed width and height for uniform size */
            width: 420px;
            height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .camera-box:hover {
            border-color: #4a9eff;
        }

        .camera-header {
            background: #222;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .camera-status {
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.9rem;
            transition: background 0.4s ease;
        }

        .status-active {
            background: #0f0;
            color: #000;
        }

        .status-offline {
            background: #c00;
            color: #fff;
        }

        .camera-feed {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .camera-feed img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #000;
            display: block;
        }

        .camera-info {
            background: #111;
            padding: 10px 16px;
            font-size: 0.85rem;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }

        .timestamp {
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Defect Detection System</h1>
    <div class="camera-grid">
        {% for url in streams %}
        <div class="camera-box">
            <div class="camera-header">
                <span>Camera {{ loop.index }}</span>
                <span class="camera-status status-offline" id="status-{{ loop.index }}">Checking...</span>
            </div>
            <div class="camera-feed">
                <img src="{{ url }}" alt="Camera {{ loop.index }} Feed" id="cam-img-{{ loop.index }}">
            </div>
            <div class="camera-info">
                <span class="timestamp" id="timestamp-{{ loop.index }}"></span>
            </div>
        </div>
        {% endfor %}
    </div>

    <script>
        function updateTimestamps() {
            const now = new Date().toLocaleTimeString();
            document.querySelectorAll('.timestamp').forEach(el => {
                el.textContent = now;
            });
        }

        function checkStream(id, url) {
            const img = document.getElementById('cam-img-' + id);
            const status = document.getElementById('status-' + id);
            
            // Add timestamp to force refresh every 10 sec
            const testUrl = url + '?t=' + new Date().getTime();

            img.onerror = () => {
                status.textContent = 'OFFLINE';
                status.classList.remove('status-active');
                status.classList.add('status-offline');
            };

            img.onload = () => {
                status.textContent = 'ACTIVE';
                status.classList.remove('status-offline');
                status.classList.add('status-active');
            };

            img.src = testUrl;
        }

        function monitorStreams() {
            document.querySelectorAll('.camera-feed img').forEach((img, idx) => {
                const id = idx + 1;
                const url = img.getAttribute('src').split('?')[0];
                checkStream(id, url);
            });
        }

        // Refresh every 10 seconds
        setInterval(monitorStreams, 10000);
        setInterval(updateTimestamps, 1000);
        window.onload = () => {
            monitorStreams();
            updateTimestamps();
        };
    </script>
</body>
</html>
